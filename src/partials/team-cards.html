{{#if d.people}}
{{#each d.people}}
<article class="person">
  <img class="person__photo" src="{{photo}}.webp" alt="Portrait of {{name}}, {{title}} at The Barthel Agency" width="480" height="600" loading="lazy">
  <div class="person__body">
    <h3 class="person__name">{{name}}{{#if credentials}} <small>{{credentials}}</small>{{/if}}</h3>
    <p class="person__title">{{title}}</p>
    {{#if bio}}
    <p class="person__bio">{{bio}}</p>
    {{/if}}
    <div class="person__meta">
      {{#if phone}}
      <a href="tel:+18123867727">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        {{phone}}
      </a>
      {{/if}}
      {{#if email}}
      <a href="mailto:{{email}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        {{email}}
      </a>
      {{/if}}
    </div>
  </div>
</article>
{{/each}}
{{/if}}
